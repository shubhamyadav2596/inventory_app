# Render Blueprint — deploys the backend (API + Kafka consumer)
services:
  - type: web
    name: inventory-fifo-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false     # set to your Vercel URL in the Render dashboard
      - key: DATABASE_URL
        sync: false     # Neon connection string
      - key: AUTH_USER
        value: admin
      - key: AUTH_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: KAFKA_ENABLED
        value: "true"
      - key: KAFKA_BROKER
        sync: false
      - key: KAFKA_API_KEY
        sync: false
      - key: KAFKA_API_SECRET
        sync: false
      - key: KAFKA_TOPIC
        value: inventory-events
      - key: KAFKA_GROUP_ID
        value: inventory-consumer-group
